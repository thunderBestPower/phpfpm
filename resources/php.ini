[Date]
date.timezone = Europe/Rome

[FILE UPLOADS]
upload_max_filesize = MAX_UPLOAD_SIZE

[Data Handling]
post_max_size = POST_MAX_SIZE

[Errors]
; Spento per default dal php.ini di produzione: qui si riaccende solo dove
; serve, passando DISPLAY_ERRORS=1 all'ambiente di sviluppo.
display_errors = DISPLAY_ERRORS

[XDebug]
; Xdebug 3: le vecchie remote_* non le legge piu'. Qui si puo' scrivere mode e
; start_with_request fissi, tanto con ENABLE_XDEBUG=0 l'entrypoint l'estensione
; non la carica proprio.
xdebug.mode=debug
xdebug.start_with_request=yes
xdebug.client_host=REMOTE_HOST
xdebug.client_port=REMOTE_PORT

; I valori arrivano dalle variabili d'ambiente (default in Dockerfile, sovrascrivibili nel docker-compose;
; DOCKER_HOST_IP e DOCKER_HOST_PORT senza default restano vuoti, come prima):
; PHP le legge da solo, funziona con qualsiasi utente del container e anche con docker exec
[Date]
date.timezone = Europe/Rome

[FILE UPLOADS]
upload_max_filesize = ${MAX_UPLOAD_SIZE}

[Data Handling]
post_max_size = ${POST_MAX_SIZE}

[XDebug]
xdebug.mode = ${ENABLE_MODE}
xdebug.client_host = ${DOCKER_HOST_IP}
xdebug.client_port = ${DOCKER_HOST_PORT}
xdebug.start_with_request = ${ENABLE_XDEBUG}

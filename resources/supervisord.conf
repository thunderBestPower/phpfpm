[supervisord]
nodaemon = true
; In nodaemon supervisord scrive gia' i propri messaggi su stdout: il logfile
; serve solo a duplicarli, quindi va nel cestino.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/app/var/log/supervisord.pid

[program:php]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
numprocs=1
